{% extends "base.html" %}
{% block title %}Sign up — Cobbler's Eye{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="form-card">
    <h1>Create your account</h1>
    <p class="sub">Free to use — start searching by image in under a minute.</p>
    <form method="POST" action="{{ url_for('auth.signup') }}">
      <div class="field">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" value="{{ full_name or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" required>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-block">Sign up</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
