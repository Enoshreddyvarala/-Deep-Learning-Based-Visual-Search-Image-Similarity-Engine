{% extends "base.html" %}
{% block title %}Log in — Cobbler's Eye{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="form-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to run a visual search and see your history.</p>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="check-row">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember" style="margin:0; text-transform:none; font-family: var(--font-body);">Keep me signed in</label>
      </div>
      <button type="submit" class="btn btn-block">Log in</button>
    </form>
    <p class="form-footer">No account yet? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
  </div>
</div>
{% endblock %}
